<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="How AI Are You? Hackathon AI-Driven Dev">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020244"/>
      <stop offset="55%" stop-color="#0b0b3d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4e4ef9"/>
      <stop offset="100%" stop-color="#dd5475"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4e4ef9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4e4ef9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4e4ef9" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <ellipse cx="960" cy="120" rx="380" ry="260" fill="url(#glow)"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <g transform="translate(72 78)">
      <rect x="0" y="0" width="232" height="30" rx="15" fill="#4e4ef9" fill-opacity="0.18" stroke="#4e4ef9" stroke-opacity="0.5"/>
      <text x="116" y="20" fill="#a9b4ff" font-size="14" font-weight="600" letter-spacing="2.2" text-anchor="middle">HACKATHON AI-DRIVEN DEV</text>
    </g>

    <text x="72" y="212" fill="#ffffff" font-size="86" font-weight="800" letter-spacing="-2">How AI Are You?</text>
    <rect x="74" y="232" width="300" height="7" rx="3.5" fill="url(#accent)"/>

    <text x="72" y="288" fill="#c9d1e8" font-size="25" font-weight="400">Construis l'outil qui mesure le niveau IA d'un développeur.</text>
    <text x="72" y="324" fill="#8b93b5" font-size="20" font-weight="400">Une journée. En solo. En distanciel.</text>

    <g transform="translate(72 358)" font-size="15" font-weight="600">
      <g>
        <rect x="0" y="0" width="146" height="34" rx="8" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="73" y="22" fill="#eef2ff" text-anchor="middle">📅 Fin août 2026</text>
      </g>
      <g transform="translate(158 0)">
        <rect x="0" y="0" width="116" height="34" rx="8" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="58" y="22" fill="#eef2ff" text-anchor="middle">⏱ 8h → 19h</text>
      </g>
      <g transform="translate(286 0)">
        <rect x="0" y="0" width="238" height="34" rx="8" fill="#f5a623" fill-opacity="0.16" stroke="#f5a623" stroke-opacity="0.55"/>
        <text x="119" y="22" fill="#f5c76b" text-anchor="middle">🏆 1 an d'abonnement ChatGPT</text>
      </g>
    </g>

  </g>
</svg>
